name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0

      - name: Build
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Smoke test
        run: |
          bin="$(find release -maxdepth 2 -type f -name HyperMix | head -n 1)"
          test -n "$bin"
          QT_QPA_PLATFORM=offscreen "$bin" --check

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/HyperMix-*-Linux-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        shell: cmd
        run: build_windows.bat

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Recurse -Filter HyperMix.exe | Select-Object -First 1
          if (-not $exe) { throw "HyperMix.exe not found" }
          Write-Host "Testing $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "HyperMix.exe --check failed: $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/HyperMix-*-Windows-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "HyperMix ${tag#v}" \
            --notes-file RELEASE_NOTES.md \
            artifacts/linux/*.tar.gz \
            artifacts/windows/*.zip
